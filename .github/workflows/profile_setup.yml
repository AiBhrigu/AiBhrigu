name: Φ-Profile-AutoSetup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Profile Repo
      uses: actions/checkout@v4

    - name: Prepare assets directory
      run: mkdir -p assets

    - name: Create Φ Banner
      run: |
        cat << 'SVG' > assets/phi_banner_gold.svg
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" width="100%" height="100%">
          <defs>
            <linearGradient id="phiGold" x1="0%" x2="100%" y1="0%" y2="0%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
              <stop offset="50%" stop-color="#D4AF37" stop-opacity="1"/>
              <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="1600" height="300" fill="#000000"/>
          <text x="50%" y="50%" font-family="Georgia, serif" font-size="180"
                fill="url(#phiGold)" text-anchor="middle" dominant-baseline="middle">Φ</text>
          <rect x="0" y="230" width="1600" height="2" fill="url(#phiGold)" />
        </svg>
        SVG

    - name: Create README
      run: |
        cat << 'MD' > README.md
        # 🜂 **Φ-COSMOGRAPHY / ORION ENGINE**
        ### Golden-Ratio Space Mapping • Resonance Systems • Cycle Intelligence  
        Fractal Research • Astronomical Mechanics • λ=1.889 Geometry

        ---

