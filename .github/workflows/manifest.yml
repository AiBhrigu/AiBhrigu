name: Build & Verify Manifest

on:
  push:
    branches: [ main, dev, feat/**, fix/** ]
  pull_request:
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install jsonschema pynacl

      - name: Build manifest
        run: |
          . .venv/bin/activate
          make manifest

      - name: Verify manifest
        run: |
          . .venv/bin/activate
          make verify

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-manifest
          path: contracts/manifest.json
