name: Nightly Results

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install jsonschema

      - name: Build results zip
        run: |
          . .venv/bin/activate
          python scripts/build_results_zip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: results-v1.zip
          path: results-v1.zip
          if-no-files-found: error

      - name: Summary
        run: |
          echo "results-v1.zip uploaded" >> $GITHUB_STEP_SUMMARY
