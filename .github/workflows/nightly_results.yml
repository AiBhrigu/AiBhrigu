      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install jsonschema

      - name: Prepare minimal results (if missing)
        run: |
          python - <<'PY'
          import os, json, datetime, pathlib
          root = pathlib.Path("orion_ai/results")
          (root / "windows").mkdir(parents=True, exist_ok=True)
          (root / "markets").mkdir(parents=True, exist_ok=True)

          # семплы, если пусто
          if not (root / "windows/gann_windows.csv").exists():
              (root / "windows/gann_windows.csv").write_text(
                  "id,start,end,grade,desc\nG1,2026-02-01,2026-02-14,A,Square-of-9 window\n"
              )
          if not (root / "windows/merriman_windows.csv").exists():
              (root / "windows/merriman_windows.csv").write_text(
                  "id,start,end,grade,desc\nM1,2026-03-10,2026-03-17,B,Primary reversal window\n"
              )
          if not (root / "markets/asset_price_BTC.csv").exists():
              (root / "markets/asset_price_BTC.csv").write_text(
                  "date,close\n2025-10-20,68000\n2025-10-21,68500\n"
              )
          if not (root / "markets/event_density_BTC.csv").exists():
              (root / "markets/event_density_BTC.csv").write_text(
                  "date,density\n2025-10-20,0.2\n2025-10-21,0.4\n"
              )

          # минимальный MANIFEST, если его нет — скрипт всё равно перезапишет
          man = root / "MANIFEST.json"
          if not man.exists():
              man.write_text(json.dumps({
                  "manifest_version":"v1",
                  "app":{"name":"ORION","version":"0.3.0"},
                  "built_at": datetime.datetime.utcnow().isoformat()+"Z",
                  "artifacts":[]
              }, indent=2))
          print("Prepared:", root)
          PY

      - name: Build results zip
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python - <<'PY'
          import traceback, json
          try:
              import scripts.build_results_zip as b
              info = b.main() if hasattr(b, "main") else None
              if info is None:
                  # поддержка старого скрипта без main()
                  import runpy
                  runpy.run_path("scripts/build_results_zip.py", run_name="__main__")
              print("BUILD_OK")
          except Exception:
  workflow_dispatch:
              traceback.print_exc()
              raise
          PY
          ls -l results-v1.zip
